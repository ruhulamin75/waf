<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>সদস্য প্রোফাইল - বন্ধু কল্যাণ সংস্থা</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Cropper.js CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0A369D;
            --primary-green: #7CD03A;
            --primary-red: #e74c3c;
            --primary-orange: #f39c12;
            --bg-light: #F4F7F6;
            --text-dark: #333;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; overflow-x: hidden; width: 100vw; }

        /* --- Loader --- */
        #pageLoader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s ease; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(10,54,157,0.2); border-top-color: var(--primary-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hide-loader { opacity: 0; pointer-events: none; }

        /* --- Sidebar Styles --- */
        .sidebar { width: 260px; background: linear-gradient(180deg, var(--primary-blue) 0%, #06236b 100%); color: #fff; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; transition: var(--transition); z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center;}
        .sidebar-header i { font-size: 35px; color: var(--primary-green); margin-bottom: 10px; }
        .sidebar-header h2 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }

        .nav-menu { flex: 1; overflow-y: auto; padding: 15px 0; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 15px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 16px; font-weight: 600; transition: var(--transition); }
        .nav-item i { width: 20px; text-align: center; font-size: 18px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; border-left: 4px solid var(--primary-green); }

        .logout-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 15px 25px; display: flex; align-items: center; gap: 15px; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.1); cursor: pointer; border: none; width: 100%; text-align: left; font-size: 16px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: var(--transition); }

        /* --- Main Content --- */
        .main-content { flex: 1; margin-left: 260px; padding: 20px 30px; transition: var(--transition); min-height: 100vh; min-width: 0; animation: fadeInUp 0.6s ease-out;}
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .menu-toggle { font-size: 24px; color: var(--primary-blue); background: none; border: none; cursor: pointer; display: none; }
        .top-header h2 { color: var(--primary-blue); font-size: 24px; font-weight: 700; }
        
        .user-profile-badge { display: flex; align-items: center; gap: 10px; background: #fff; padding: 5px 15px; border-radius: 20px; box-shadow: var(--card-shadow); font-weight: 600; color: #555; }
        .user-profile-badge i { color: var(--primary-green); font-size: 18px; }

        /* --- Summary Cards (3 Required Items) --- */
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .summary-card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: var(--card-shadow); display: flex; align-items: center; gap: 15px; transition: 0.3s; }
        .summary-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .summary-card i { font-size: 35px; opacity: 0.9; }
        .summary-card .info h4 { font-size: 14px; color: #777; margin-bottom: 5px; }
        .summary-card .info h2 { font-size: 24px; color: var(--text-dark); font-weight: 700; }

        .card-blue { border-left: 4px solid var(--primary-blue); } .card-blue i { color: var(--primary-blue); }
        .card-red { border-left: 4px solid var(--primary-red); } .card-red i { color: var(--primary-red); }
        .card-orange { border-left: 4px solid var(--primary-orange); } .card-orange i { color: var(--primary-orange); }

        /* --- Profile Edit Form --- */
        .form-container { background: #fff; padding: 30px; border-radius: 15px; box-shadow: var(--card-shadow); max-width: 800px; margin: 0 auto; border-top: 4px solid var(--primary-green); }
        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header h3 { font-size: 22px; color: var(--text-dark); font-weight: 700; margin-bottom: 5px; }
        .form-header p { font-size: 14px; color: #777; }

        /* Picture Upload Section */
        .profile-pic-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .pic-upload-container { position: relative; width: 130px; height: 130px; }
        .profile-pic-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-green); background: #f1f1f1; display: flex; align-items: center; justify-content: center; }
        .profile-pic-preview i { font-size: 45px; color: #ccc; }

        .pic-upload-btn { position: absolute; bottom: 0; right: 5px; background: var(--primary-blue); color: #fff; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: var(--transition); }
        .pic-upload-btn:hover { background: #06236b; transform: scale(1.1); }
        #memberPhoto { display: none; }

        /* Form Inputs */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 15px; font-weight: 600; color: #555; }
        .input-group input, .input-group textarea { padding: 12px 15px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: var(--transition); background: #fafafa; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary-green); background: #fff; box-shadow: 0 0 0 3px rgba(124,208,58,0.1); }
        .input-group textarea { resize: vertical; min-height: 80px; }

        /* Lock Phone Number Field */
        .input-group input[readonly] { background: #e9ecef !important; color: #777 !important; cursor: not-allowed; border-color: #ddd !important; box-shadow: none !important; }

        /* Submit Button */
        .btn-submit { background: linear-gradient(135deg, var(--primary-green), #68b32e); color: #fff; border: none; padding: 15px; width: 100%; font-size: 17px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 25px; transition: var(--transition); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(124,208,58,0.3); }
        .btn-submit:disabled { background: #999; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- Image Cropper Modal --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s ease; padding: 15px; }
        .modal.active { opacity: 1; visibility: visible; }
        .modal-content { background: #ffffff; border-radius: 15px; padding: 20px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.3); transform: scale(0.9); transition: 0.3s ease; }
        .modal.active .modal-content { transform: scale(1); }

        .cropper-area { width: 100%; height: 300px; background: #fff; margin: 15px 0; border-radius: 8px; overflow: hidden; border: 1px solid #eee; }
        .cropper-area img { max-width: 100%; display: block; }
        
        .cropper-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px;}
        .btn-crop-cancel { flex: 1; background: #ffeaea; color: #e74c3c; border: none; padding: 12px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s;}
        .btn-crop-cancel:hover { background: #e74c3c; color: white;}
        .btn-crop-save { flex: 1; background: var(--primary-green); color: #fff; border: none; padding: 12px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s;}
        .btn-crop-save:hover { background: #68b32e;}

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Responsive --- */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); } .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px;} .menu-toggle { display: block; }
            .overlay.active { display: block; opacity: 1; }
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; }
            .cropper-area { height: 260px; }
        }
    </style>
</head>
<body>

    <div id="pageLoader"><div class="spinner"></div><h3 style="color: var(--primary-blue);">লোড হচ্ছে...</h3></div>
    <div class="overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar (Simplified for Member) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-handshake"></i>
            <h2>বন্ধু কল্যাণ সংস্থা</h2>
        </div>
        
        <nav class="nav-menu">
            <a href="member-profile.html" class="nav-item active"><i class="fas fa-user-circle"></i> আমার প্রোফাইল</a>
            <!-- Members don't need admin links. Add more member specific links here if needed -->
        </nav>

        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> লগআউট করুন</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="top-header">
            <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <h2>সদস্য ড্যাশবোর্ড</h2>
            <div class="user-profile-badge">
                <i class="fas fa-user-check"></i>
                <span id="topMemberName">সদস্য</span>
            </div>
        </div>

        <!-- 3 Specific Summary Cards -->
        <div class="summary-grid">
            <div class="summary-card card-blue">
                <i class="fas fa-piggy-bank"></i>
                <div class="info">
                    <h4>মোট মাসিক জমা</h4>
                    <h2 id="cMonthlyDeposit">৳ 0.00</h2>
                </div>
            </div>
            <div class="summary-card card-red">
                <i class="fas fa-money-check-alt"></i>
                <div class="info">
                    <h4>বর্তমান ঋণের বকেয়া</h4>
                    <h2 id="cLoanDue">৳ 0.00</h2>
                </div>
            </div>
            <div class="summary-card card-orange">
                <i class="fas fa-shopping-basket"></i>
                <div class="info">
                    <h4>পণ্য ক্রয়ের বকেয়া</h4>
                    <h2 id="cProductDue">৳ 0.00</h2>
                </div>
            </div>
        </div>

        <!-- Profile Edit Form -->
        <div class="form-container">
            <div class="form-header">
                <h3>প্রোফাইল আপডেট করুন</h3>
                <p>আপনার প্রোফাইলের তথ্য এবং ছবি পরিবর্তন করতে পারবেন (মোবাইল নম্বর ব্যতীত)।</p>
            </div>

            <form id="editProfileForm">
                
                <!-- Picture Upload -->
                <div class="profile-pic-wrapper">
                    <div class="pic-upload-container">
                        <img src="" alt="" class="profile-pic-preview" id="picPreview" style="display: none;">
                        <div class="profile-pic-preview" id="picPlaceholder">
                            <i class="fas fa-user"></i>
                        </div>
                        <label for="memberPhoto" class="pic-upload-btn" title="ছবি পরিবর্তন করুন">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="memberPhoto" accept="image/png, image/jpeg">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>সদস্য আইডি (পরিবর্তনযোগ্য নয়)</label>
                        <input type="text" id="mId" readonly>
                    </div>
                    <div class="input-group">
                        <label>পূর্ণ নাম</label>
                        <input type="text" id="mName" required placeholder="আপনার নাম">
                    </div>
                    <div class="input-group">
                        <label>মোবাইল নম্বর (পরিবর্তনযোগ্য নয়)</label>
                        <input type="tel" id="mPhone" readonly title="মোবাইল নম্বর পরিবর্তন করতে অ্যাডমিনের সাথে যোগাযোগ করুন">
                    </div>
                    <div class="input-group">
                        <label>লগইন পাসওয়ার্ড</label>
                        <input type="text" id="mPassword" required placeholder="নতুন পাসওয়ার্ড দিন">
                    </div>
                    <div class="input-group full-width">
                        <label>বর্তমান ঠিকানা</label>
                        <textarea id="mAddress" placeholder="আপনার বিস্তারিত ঠিকানা লিখুন"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-user-edit"></i> প্রোফাইল সেভ করুন
                </button>
            </form>
        </div>
    </main>

    <!-- Cropper Modal -->
    <div class="modal" id="cropperModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 5px; color: var(--primary-blue);">ছবি ঠিক করুন</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">ছবিটি টেনে সঠিক পজিশনে বসান।</p>
            
            <div class="cropper-area">
                <img id="imageToCrop" src="">
            </div>
            
            <div class="cropper-btns">
                <button type="button" class="btn-crop-cancel" onclick="closeCropper()"><i class="fas fa-times"></i> বাতিল</button>
                <button type="button" class="btn-crop-save" onclick="saveCroppedImage()"><i class="fas fa-check"></i> ক্রপ করুন</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // --- Image Cropping Logic ---
        let cropper;
        let finalCroppedBase64 = "";

        const photoInput = document.getElementById('memberPhoto');
        const cropperModal = document.getElementById('cropperModal');
        const imageToCrop = document.getElementById('imageToCrop');
        const picPreview = document.getElementById('picPreview');
        const picPlaceholder = document.getElementById('picPlaceholder');

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imageToCrop.src = event.target.result;
                    cropperModal.classList.add('active');
                    
                    if (cropper) cropper.destroy();
                    
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                        background: false
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        function closeCropper() {
            cropperModal.classList.remove('active');
            if (cropper) cropper.destroy();
            photoInput.value = ""; 
        }

        function saveCroppedImage() {
            if (!cropper) return;
            
            // ফিক্স: fillColor: '#fff' যুক্ত করায় ট্রান্সপারেন্ট ব্যাকগ্রাউন্ড সলিড সাদা হবে
            finalCroppedBase64 = cropper.getCroppedCanvas({
                width: 250,
                height: 250,
                fillColor: '#fff' 
            }).toDataURL('image/jpeg', 0.8);

            picPreview.src = finalCroppedBase64;
            picPreview.style.display = 'block';
            picPlaceholder.style.display = 'none';
            
            closeCropper();
        }
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCA-r0w4FJ1ATXxiHOJCOwcCZwZXusYZes",
            authDomain: "waf-database-8df19.firebaseapp.com",
            databaseURL: "https://waf-database-8df19-default-rtdb.firebaseio.com",
            projectId: "waf-database-8df19",
            storageBucket: "waf-database-8df19.firebasestorage.app",
            messagingSenderId: "660108849951",
            appId: "1:660108849951:web:c57927e6c6b4372f12762a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Security Check: Get Logged In Member ID
        // URL Parameter ?id=XXX অথবা LocalStorage থেকে আইডি নিবে
        const urlParams = new URLSearchParams(window.location.search);
        let loggedInMemberId = urlParams.get('id') || localStorage.getItem("loggedInMemberId") || localStorage.getItem("memberPhone");

        if (!loggedInMemberId) {
            alert("অনুগ্রহ করে লগইন করুন।");
            window.location.href = "login.html";
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("লগআউট করতে চান?")) {
                localStorage.removeItem("loggedInMemberId");
                localStorage.removeItem("memberPhone");
                window.location.href = 'login.html';
            }
        });

        let currentMemberName = "";

        // Fetch Member Profile Data
        onValue(ref(db, 'members/' + loggedInMemberId), (snapshot) => {
            if (snapshot.exists()) {
                let m = snapshot.val();
                currentMemberName = m.name;
                
                document.getElementById('topMemberName').innerText = m.name;
                
                // Set Form Fields
                document.getElementById('mId').value = m.id;
                document.getElementById('mName').value = m.name;
                document.getElementById('mPhone').value = m.phone;
                document.getElementById('mPassword').value = m.password;
                document.getElementById('mAddress').value = m.address || "";
                
                if (m.photo && m.photo !== "") {
                    document.getElementById('picPreview').src = m.photo;
                    document.getElementById('picPreview').style.display = 'block';
                    document.getElementById('picPlaceholder').style.display = 'none';
                    finalCroppedBase64 = m.photo;
                }

                // Cards Data
                let monthly = m.funds && m.funds.monthly ? parseFloat(m.funds.monthly) : 0;
                document.getElementById('cMonthlyDeposit').innerText = "৳ " + monthly.toFixed(2);
                
                let loanDue = 0;
                if (m.loan && m.loan.totalAmount) {
                    loanDue = parseFloat(m.loan.totalAmount) - parseFloat(m.loan.paidAmount || 0);
                }
                document.getElementById('cLoanDue').innerText = "৳ " + loanDue.toFixed(2);
                
                document.getElementById('pageLoader').classList.add('hide-loader');
            } else {
                alert("সদস্যের ডাটা ডাটাবেসে পাওয়া যায়নি!");
                window.location.href = "login.html";
            }
        });

        // Fetch Sales for Product Purchase Due calculation
        onValue(ref(db, 'sales'), (snapshot) => {
            let pDue = 0;
            if(snapshot.exists()) {
                snapshot.forEach(child => {
                    let sale = child.val();
                    // Match by Member ID or Name
                    if (sale.customer === loggedInMemberId || (currentMemberName && sale.customer === currentMemberName) || sale.customer.includes(loggedInMemberId)) {
                        pDue += parseFloat(sale.due || 0);
                    }
                });
            }
            document.getElementById('cProductDue').innerText = "৳ " + pDue.toFixed(2);
        });

        // Form Submit: Profile Update
        document.getElementById('editProfileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> আপডেট হচ্ছে...';
            btn.disabled = true;

            const newName = document.getElementById('mName').value.trim();
            const newPassword = document.getElementById('mPassword').value.trim();
            const newAddress = document.getElementById('mAddress').value.trim();

            if (newPassword.length < 4) {
                alert("পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে!");
                btn.innerHTML = '<i class="fas fa-user-edit"></i> প্রোফাইল সেভ করুন';
                btn.disabled = false;
                return;
            }

            try {
                // Update only allowed fields (Phone remains unchanged in DB)
                await update(ref(db, 'members/' + loggedInMemberId), {
                    name: newName,
                    password: newPassword,
                    address: newAddress,
                    photo: finalCroppedBase64
                });

                alert("আপনার প্রোফাইল সফলভাবে আপডেট হয়েছে!");
            } catch (error) {
                console.error(error);
                alert("প্রোফাইল আপডেট করতে সমস্যা হয়েছে: " + error.message);
            } finally {
                btn.innerHTML = '<i class="fas fa-user-edit"></i> প্রোফাইল সেভ করুন';
                btn.disabled = false;
            }
        });
    </script>
</body>
