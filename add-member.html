<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>নতুন সদস্য যুক্ত করুন - বন্ধু কল্যাণ সংস্থা</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #0A369D;
            --primary-green: #7CD03A;
            --bg-light: #F4F7F6;
            --text-dark: #333;
            --card-shadow: 0 4px 15px rgba(0,0,0,0.05);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); display: flex; overflow-x: hidden; width: 100vw; }

        /* --- Sidebar Styles --- */
        .sidebar { width: 260px; background: linear-gradient(180deg, var(--primary-blue) 0%, #06236b 100%); color: #fff; height: 100vh; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; transition: var(--transition); z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.1); }
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; align-items: center;}
        .sidebar-header i { font-size: 35px; color: var(--primary-green); margin-bottom: 10px; }
        .sidebar-header h2 { font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }

        .nav-menu { flex: 1; overflow-y: auto; padding: 15px 0; }
        .nav-menu::-webkit-scrollbar { width: 5px; }
        .nav-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 5px; }
        .nav-item { padding: 12px 25px; display: flex; align-items: center; gap: 15px; color: rgba(255,255,255,0.8); text-decoration: none; font-size: 16px; font-weight: 600; transition: var(--transition); }
        .nav-item i { width: 20px; text-align: center; font-size: 18px; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: #fff; border-left: 4px solid var(--primary-green); }

        .logout-btn { background: rgba(255, 71, 87, 0.1); color: #ff4757; padding: 15px 25px; display: flex; align-items: center; gap: 15px; font-weight: 700; border-top: 1px solid rgba(255,255,255,0.1); cursor: pointer; border: none; width: 100%; text-align: left; font-size: 16px; }

        /* --- Overlay for Mobile --- */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; opacity: 0; transition: var(--transition); }

        /* --- Main Content Styles --- */
        .main-content { flex: 1; margin-left: 260px; padding: 20px 30px; transition: var(--transition); min-height: 100vh; min-width: 0; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .menu-toggle { font-size: 24px; color: var(--primary-blue); background: none; border: none; cursor: pointer; display: none; }
        .top-header h2 { color: var(--primary-blue); font-size: 24px; font-weight: 700; }
        .user-profile { display: flex; align-items: center; gap: 10px; background: #fff; padding: 5px 15px; border-radius: 20px; box-shadow: var(--card-shadow); }
        
        /* --- Form Container Styles --- */
        .form-container { background: #fff; padding: 30px; border-radius: 15px; box-shadow: var(--card-shadow); max-width: 700px; margin: 0 auto; animation: fadeInUp 0.6s ease-out; border-top: 4px solid var(--primary-blue);}

        .form-header { text-align: center; margin-bottom: 25px; }
        .form-header h3 { font-size: 22px; color: var(--text-dark); font-weight: 700; margin-bottom: 5px; }
        .form-header p { font-size: 14px; color: #777; }

        /* Picture Upload Section */
        .profile-pic-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .pic-upload-container { position: relative; width: 120px; height: 120px; }
        .profile-pic-preview { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-green); background: #f1f1f1; display: flex; align-items: center; justify-content: center; }
        .profile-pic-preview i { font-size: 40px; color: #ccc; }

        .pic-upload-btn { position: absolute; bottom: 0; right: 0; background: var(--primary-blue); color: #fff; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: var(--transition); }
        .pic-upload-btn:hover { background: var(--primary-green); }
        #memberPhoto { display: none; }

        /* Form Inputs */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px;}
        .input-group label { font-size: 15px; font-weight: 600; color: #555; }
        .input-group input, .input-group textarea { padding: 12px 15px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; transition: var(--transition); background: #fafafa; }
        .input-group input:focus, .input-group textarea:focus { border-color: var(--primary-blue); background: #fff; box-shadow: 0 0 0 3px rgba(10,54,157,0.1); }
        .input-group textarea { resize: vertical; min-height: 80px; }

        /* Submit Button */
        .btn-submit { background: linear-gradient(135deg, var(--primary-blue), #082d85); color: #fff; border: none; padding: 15px; width: 100%; font-size: 17px; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 25px; transition: var(--transition); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(10,54,157,0.2); }
        .btn-submit:disabled { background: #999; cursor: not-allowed; transform: none; }

        /* Messages */
        .message-box { padding: 12px; border-radius: 8px; margin-top: 15px; display: none; font-weight: 600; font-size: 14px; text-align: center; }
        .msg-error { background: rgba(255, 71, 87, 0.1); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); }
        .msg-success { background: rgba(124, 208, 58, 0.1); color: #5a9e26; border: 1px solid rgba(124, 208, 58, 0.3); }

        /* --- Standard Modal / Cropper Modal (FIXED) --- */
        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); 
            z-index: 99999; 
            display: flex; align-items: center; justify-content: center; 
            opacity: 0; visibility: hidden; 
            transition: 0.3s ease; 
            padding: 15px;
        }
        .modal.active { opacity: 1; visibility: visible; }
        
        .modal-content { 
            background: #ffffff; 
            border-radius: 15px; 
            padding: 20px; 
            width: 100%; 
            max-width: 450px; 
            text-align: center; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transform: scale(0.9);
            transition: 0.3s ease;
        }
        .modal.active .modal-content { transform: scale(1); }

        .cropper-area { width: 100%; height: 300px; background: #eee; margin: 15px 0; border-radius: 8px; overflow: hidden;}
        .cropper-area img { max-width: 100%; display: block; }
        
        .cropper-btns { display: flex; gap: 10px; justify-content: center; margin-top: 15px;}
        .btn-crop-cancel { flex: 1; background: #ffeaea; color: #e74c3c; border: none; padding: 12px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s;}
        .btn-crop-cancel:hover { background: #e74c3c; color: white;}
        .btn-crop-save { flex: 1; background: var(--primary-green); color: #fff; border: none; padding: 12px 10px; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 15px; transition: 0.3s;}
        .btn-crop-save:hover { background: #68b32e;}

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Responsive --- */
        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); } .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 20px 15px;} .menu-toggle { display: block; }
            .overlay.active { display: block; opacity: 1; }
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: span 1; }
            .cropper-area { height: 260px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-handshake"></i>
            <h2>বন্ধু কল্যাণ সংস্থা</h2>
        </div>
        
        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a>
            <a href="add-member.html" class="nav-item active"><i class="fas fa-user-plus"></i> নতুন সদস্য</a>
            <a href="member-list.html" class="nav-item"><i class="fas fa-users"></i> সদস্য তালিকা</a>
            <a href="products.html" class="nav-item"><i class="fas fa-box-open"></i> পণ্য তালিকা</a>
            <a href="transactions.html" class="nav-item"><i class="fas fa-exchange-alt"></i> জমা/উত্তোলন</a>
            <a href="investment.html" class="nav-item"><i class="fas fa-chart-line"></i> বিনিয়োগ/মুনাফা</a>
            <a href="loan.html" class="nav-item"><i class="fas fa-hand-holding-usd"></i> বর্তমান ঋণ</a>
            <a href="reports.html" class="nav-item"><i class="fas fa-file-invoice-dollar"></i> রিপোর্টস</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> সেটিংস</a>
        </nav>

        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> লগআউট করুন</button>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="top-header">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <h2>নতুন সদস্য নিবন্ধন</h2>
            <div class="user-profile">
                <i class="fas fa-user-shield"></i>
                <span>অ্যাডমিন</span>
            </div>
        </div>

        <div class="form-container">
            <div class="form-header">
                <h3>সদস্যের তথ্য প্রদান করুন</h3>
                <p>সদস্যের বিস্তারিত তথ্য দিয়ে ডাটাবেসে যুক্ত করুন</p>
            </div>

            <form id="addMemberForm">
                
                <!-- Picture Upload -->
                <div class="profile-pic-wrapper">
                    <div class="pic-upload-container">
                        <img src="" alt="" class="profile-pic-preview" id="picPreview" style="display: none;">
                        <div class="profile-pic-preview" id="picPlaceholder">
                            <i class="fas fa-user"></i>
                        </div>
                        <label for="memberPhoto" class="pic-upload-btn">
                            <i class="fas fa-camera"></i>
                        </label>
                        <input type="file" id="memberPhoto" accept="image/*">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="input-group">
                        <label>সদস্য আইডি</label>
                        <input type="text" id="memberId" placeholder="যেমন: WAF-01" required>
                    </div>
                    <div class="input-group">
                        <label>পূর্ণ নাম</label>
                        <input type="text" id="memberName" placeholder="সদস্যের নাম লিখুন" required>
                    </div>
                    <div class="input-group">
                        <label>মোবাইল নম্বর</label>
                        <input type="tel" id="memberPhone" placeholder="০১৭xxxxxxxx" required>
                    </div>
                    <div class="input-group">
                        <label>লগইন পাসওয়ার্ড</label>
                        <input type="text" id="memberPassword" placeholder="কমপক্ষে ৪ অক্ষর" required>
                    </div>
                    <div class="input-group full-width">
                        <label>বর্তমান ঠিকানা (ঐচ্ছিক)</label>
                        <textarea id="memberAddress" placeholder="বিস্তারিত ঠিকানা লিখুন"></textarea>
                    </div>
                </div>

                <div id="statusMessage" class="message-box"></div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    <i class="fas fa-save"></i> ডাটাবেসে যুক্ত করুন
                </button>
            </form>
        </div>
    </main>

    <!-- Cropper Modal -->
    <div class="modal" id="cropperModal">
        <div class="modal-content">
            <h3 style="margin-bottom: 5px; color: var(--primary-blue);">ছবি ঠিক করুন</h3>
            <p style="font-size: 13px; color: #666; margin-bottom: 10px;">মাউস বা হাত দিয়ে টেনে ছবি সঠিক পজিশনে বসান।</p>
            
            <div class="cropper-area">
                <img id="imageToCrop" src="">
            </div>
            
            <div class="cropper-btns">
                <button type="button" class="btn-crop-cancel" onclick="closeCropper()"><i class="fas fa-times"></i> বাতিল</button>
                <button type="button" class="btn-crop-save" onclick="saveCroppedImage()"><i class="fas fa-check"></i> ক্রপ করুন</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <script>
        // Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');

        menuToggle.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('active'); });
        overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); });

        // --- Image Cropping Logic ---
        let cropper;
        let finalCroppedBase64 = "";

        const photoInput = document.getElementById('memberPhoto');
        const cropperModal = document.getElementById('cropperModal');
        const imageToCrop = document.getElementById('imageToCrop');
        const picPreview = document.getElementById('picPreview');
        const picPlaceholder = document.getElementById('picPlaceholder');

        photoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    imageToCrop.src = event.target.result;
                    cropperModal.classList.add('active');
                    
                    if (cropper) cropper.destroy();
                    
                    cropper = new Cropper(imageToCrop, {
                        aspectRatio: 1,
                        viewMode: 1,
                        background: false
                    });
                };
                reader.readAsDataURL(file);
            }
        });

        function closeCropper() {
            cropperModal.classList.remove('active');
            if (cropper) cropper.destroy();
            photoInput.value = ""; 
        }

        function saveCroppedImage() {
            if (!cropper) return;
            
            finalCroppedBase64 = cropper.getCroppedCanvas({
                width: 250,
                height: 250,
                fillColor: '#fff' 
            }).toDataURL('image/jpeg', 0.8);

            picPreview.src = finalCroppedBase64;
            picPreview.style.display = 'block';
            picPlaceholder.style.display = 'none';
            
            closeCropper();
        }
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCA-r0w4FJ1ATXxiHOJCOwcCZwZXusYZes",
            authDomain: "waf-database-8df19.firebaseapp.com",
            databaseURL: "https://waf-database-8df19-default-rtdb.firebaseio.com",
            projectId: "waf-database-8df19",
            storageBucket: "waf-database-8df19.firebasestorage.app",
            messagingSenderId: "660108849951",
            appId: "1:660108849951:web:c57927e6c6b4372f12762a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Security Check (Updated to sessionStorage)
        onAuthStateChanged(auth, (user) => { 
            if (!user || sessionStorage.getItem("isAdminLoggedIn") !== "true") {
                window.location.href = 'login.html'; 
            }
        });

        // Logout (Updated to clean sessionStorage)
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if(confirm("লগআউট করতে চান?")) {
                sessionStorage.removeItem('isAdminLoggedIn');
                localStorage.removeItem('isAdminLoggedIn');
                signOut(auth).then(() => {
                    window.location.href = 'login.html';
                }).catch(() => {
                    window.location.href = 'login.html';
                });
            }
        });

        // Form Submission Logic
        document.getElementById('addMemberForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('statusMessage');
            
            const id = document.getElementById('memberId').value.trim();
            const name = document.getElementById('memberName').value.trim();
            const phone = document.getElementById('memberPhone').value.trim();
            const pass = document.getElementById('memberPassword').value.trim();
            const address = document.getElementById('memberAddress').value.trim();

            if (pass.length < 4) {
                showMessage("পাসওয়ার্ড কমপক্ষে ৪ অক্ষরের হতে হবে!", "error");
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> সেভ হচ্ছে...';
            btn.disabled = true;
            msgBox.style.display = 'none';

            try {
                await set(ref(db, 'members/' + id), {
                    id: id,
                    name: name,
                    phone: phone,
                    password: pass, 
                    address: address || "", 
                    photo: finalCroppedBase64, 
                    status: "active",
                    joinDate: new Date().toISOString(),
                    funds: { admission: 0, monthly: 0, donation: 0, total: 0 }
                });

                showMessage("সদস্য সফলভাবে যুক্ত হয়েছে!", "success");
                
                this.reset(); 
                finalCroppedBase64 = "";
                document.getElementById('picPreview').style.display = 'none';
                document.getElementById('picPlaceholder').style.display = 'flex';

            } catch (error) {
                showMessage("ডাটাবেসে সংরক্ষণ করতে সমস্যা হয়েছে: " + error.message, "error");
                console.error(error);
            } finally {
                btn.innerHTML = '<i class="fas fa-save"></i> ডাটাবেসে যুক্ত করুন';
                btn.disabled = false;
            }
        });

        function showMessage(text, type) {
            const msgBox = document.getElementById('statusMessage');
            msgBox.textContent = text;
            msgBox.className = 'message-box ' + (type === 'error' ? 'msg-error' : 'msg-success');
            msgBox.style.display = 'block';
        }
    </script>
</body>
</html>
